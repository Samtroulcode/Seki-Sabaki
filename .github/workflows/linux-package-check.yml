name: Linux Package Check

# Manual packaging verification tool for Linux distributables. It only
# builds and uploads artifacts; it never creates a release, tag, or
# prerelease, and it does not invoke any other platform job.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Build Linux distributables
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-check
          path: |
            dist/seki-*-linux-*.AppImage
          if-no-files-found: error
