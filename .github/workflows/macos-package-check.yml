name: macOS Package Check

# Manual diagnostic/development packaging workflow for macOS distributables.
# It only builds and uploads artifacts; it never creates a release, tag, or
# prerelease, and it does not invoke any other platform job.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      # Diagnostic only: these DMGs are unsigned and unnotarized. Their
      # artifacts are for development and testing only; they are not official
      # supported public release artifacts.
      - name: Build macOS distributables
        run: npm run dist:macos:unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package-check
          path: |
            dist/seki-*-mac-*.dmg
          if-no-files-found: error